<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f4" />
    <title>Daymark â€” Todo list</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #252421; background: #f8f7f4; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 0%, #fff 0, transparent 32rem), #f8f7f4; }
      .shell { width: min(100% - 2rem, 42rem); margin: 0 auto; padding: clamp(3rem, 10vw, 6rem) 0 4rem; }
      .eyebrow { margin: 0 0 .65rem; color: #a44c2b; font-size: .76rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3.2rem, 12vw, 5.7rem); font-weight: 400; letter-spacing: -.075em; line-height: .87; }
      .intro { max-width: 29rem; margin: 1.4rem 0 2.25rem; color: #6e6a62; font-size: 1.05rem; line-height: 1.55; }
      .add-form { display: flex; gap: .65rem; margin-bottom: 1.45rem; }
      .add-form input { min-width: 0; flex: 1; padding: .9rem 1rem; border: 1px solid #dcd8d0; border-radius: .7rem; outline: 0; color: inherit; font: inherit; background: #fff; transition: border-color .2s, box-shadow .2s; }
      .add-form input:focus { border-color: #a44c2b; box-shadow: 0 0 0 3px #f0dcd2; }
      button { border: 0; border-radius: .7rem; color: #fff; font: inherit; font-weight: 750; cursor: pointer; transition: transform .15s, background .15s; }
      button:hover { transform: translateY(-1px); }
      button:focus-visible, .todo-check:focus-visible { outline: 3px solid #7eb4d9; outline-offset: 3px; }
      .add-button { padding: .85rem 1.15rem; background: #a44c2b; }
      .add-button:hover { background: #863d22; }
      .list-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: .65rem; color: #78736a; font-size: .84rem; font-weight: 700; }
      .list-bar p { margin: 0; }
      .clear-button { padding: .25rem 0; color: #a44c2b; background: transparent; font-size: .84rem; }
      .clear-button[hidden] { display: none; }
      .todo-list { display: grid; gap: .65rem; padding: 0; margin: 0; list-style: none; }
      .todo { display: grid; grid-template-columns: auto 1fr auto; gap: .85rem; align-items: center; padding: 1rem; border: 1px solid #e5e1da; border-radius: .8rem; background: rgba(255,255,255,.78); box-shadow: 0 .35rem 1.25rem rgba(56, 48, 38, .035); }
      .todo-check { width: 1.25rem; height: 1.25rem; margin: 0; accent-color: #a44c2b; cursor: pointer; }
      .todo-text { overflow-wrap: anywhere; font-size: 1rem; line-height: 1.35; }
      .todo.done .todo-text { color: #99938a; text-decoration: line-through; text-decoration-thickness: 1.5px; }
      .delete-button { width: 2rem; height: 2rem; padding: 0; color: #8f887e; background: transparent; font-size: 1.35rem; font-weight: 400; line-height: 1; }
      .delete-button:hover { color: #a44c2b; background: #faefeb; }
      .empty { padding: 2.5rem 1rem; border: 1px dashed #d6d1c8; border-radius: .8rem; color: #888278; text-align: center; line-height: 1.5; }
      @media (max-width: 430px) { .shell { width: min(100% - 1.25rem, 42rem); } .add-form { gap: .45rem; } .add-button { padding-inline: .85rem; } }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">A little space for today</p>
      <h1>Daymark.</h1>
      <p class="intro">Make a short list, make a small start, and mark the moments that are done.</p>
      <form class="add-form" id="add-form">
        <input id="todo-input" type="text" maxlength="180" placeholder="What needs doing?" autocomplete="off" aria-label="New todo" required />
        <button class="add-button" type="submit">Add</button>
      </form>
      <div class="list-bar">
        <p id="summary" aria-live="polite"></p>
        <button class="clear-button" id="clear-done" type="button" hidden>Clear completed</button>
      </div>
      <ul class="todo-list" id="todo-list" aria-label="Todo list"></ul>
    </main>
    <script>
      const STORAGE_KEY = "daymark-todos";
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#todo-input");
      const list = document.querySelector("#todo-list");
      const summary = document.querySelector("#summary");
      const clearDone = document.querySelector("#clear-done");
      let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }
      function render() {
        list.replaceChildren();
        const remaining = todos.filter(todo => !todo.done).length;
        summary.textContent = todos.length ? `${remaining} ${remaining === 1 ? "thing" : "things"} left` : "Your list is clear";
        clearDone.hidden = !todos.some(todo => todo.done);
        if (!todos.length) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "Nothing here yet. Add one thing to begin.";
          list.append(empty);
          return;
        }
        todos.forEach(todo => {
          const item = document.createElement("li");
          item.className = `todo${todo.done ? " done" : ""}`;
          const check = document.createElement("input");
          check.className = "todo-check"; check.type = "checkbox"; check.checked = todo.done;
          check.setAttribute("aria-label", `Mark ${todo.text} as ${todo.done ? "not done" : "done"}`);
          check.addEventListener("change", () => { todo.done = check.checked; save(); render(); });
          const text = document.createElement("span"); text.className = "todo-text"; text.textContent = todo.text;
          const remove = document.createElement("button");
          remove.className = "delete-button"; remove.type = "button"; remove.textContent = "Ã—"; remove.setAttribute("aria-label", `Delete ${todo.text}`);
          remove.addEventListener("click", () => { todos = todos.filter(item => item.id !== todo.id); save(); render(); });
          item.append(check, text, remove); list.append(item);
        });
      }
      form.addEventListener("submit", event => {
        event.preventDefault(); const text = input.value.trim(); if (!text) return;
        todos.unshift({ id: crypto.randomUUID(), text, done: false }); save(); render(); form.reset(); input.focus();
      });
      clearDone.addEventListener("click", () => { todos = todos.filter(todo => !todo.done); save(); render(); });
      render();
    </script>
  </body>
</html>
